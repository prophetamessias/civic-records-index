name: Schema tests
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/civic_index/**'
      - 'tests/**'
      - '.github/workflows/schema-tests.yml'
  push:
    branches: [dev, feature/source-index-schema, feature/windsor-source-discovery, feature/api-readiness-dcmc, feature/dev-preview-d1]
    paths:
      - 'migrations/**'
      - 'src/civic_index/**'
      - 'tests/**'
      - '.github/workflows/schema-tests.yml'
permissions:
  contents: read
jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SQLite migration and constraints
        run: python -m unittest discover -s tests -v
