name: Worker API tests
on:
  pull_request:
    paths:
      - 'src/worker.mjs'
      - 'tests/test_*.mjs'
      - 'package.json'
      - '.github/workflows/worker-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only publication gating
        run: npm run test:worker
